<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4fd8">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<title>名刺ブースト</title>
<style>
:root{--bg:#f4f6fb;--fg:#14213d;--card:#fff;--line:#e2e7f1;--pri:#1f4fd8;--pri2:#1639a8;--chip:#e6edff;--mut:#667089;--err:#c0392b;--warn:#b45309;--warnbg:#fff7e6;--hi:#e8590c;--sh:0 2px 10px rgba(20,40,90,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 0 8px}
header .brand{display:flex;align-items:center;gap:9px;flex:1;white-space:nowrap}
header .brand svg{flex:none}
.chips{display:flex;gap:8px;align-items:center;margin:2px 0 4px}
#btnSettings{white-space:nowrap}
h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.01em}
.badge{font-size:12px;color:var(--mut)}
#count{background:var(--chip);color:var(--pri);border-radius:20px;padding:3px 11px;font-weight:700}
#count:empty{display:none}
section{background:var(--card);border-radius:16px;padding:14px 16px;margin:12px 0;box-shadow:var(--sh)}
h2{font-size:15px;margin:0 0 10px;color:var(--fg);font-weight:800}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,textarea,select{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--pri);outline-offset:0;border-color:transparent}
textarea{min-height:120px;resize:vertical}
button{font:inherit;border:0;border-radius:14px;padding:13px 16px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:700;box-shadow:0 6px 14px rgba(31,79,216,.22)}
button.sec{background:var(--chip);color:var(--pri);border:0;box-shadow:none}
button.sm{padding:7px 13px;font-size:14px;border-radius:12px}
button.mic{width:100%;padding:16px;font-size:17px}
button.mic.rec{background:var(--err);color:#fff}
.miclive{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:15px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--err);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
#micInterim{min-height:1.3em;margin-top:4px;color:var(--mut);font-size:14px}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shot{border:1.5px dashed var(--pri);border-radius:14px;padding:8px;text-align:center;min-height:110px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.shot img{max-width:100%;max-height:140px;border-radius:8px;object-fit:contain;margin:0 auto;display:none}
#status{min-height:1.4em;font-size:14px;color:var(--mut)}#status.err{color:var(--err)}
.warn{background:var(--warnbg);box-shadow:inset 0 0 0 1px var(--warn)}
.warn h2{color:var(--warn)}
.item{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.hidden{display:none}
nav.row{position:fixed;left:0;right:0;bottom:0;z-index:5;margin:0;gap:0;background:var(--card);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom));flex-wrap:nowrap;box-shadow:0 -4px 16px rgba(20,40,90,.08)}
nav.row button{background:none;box-shadow:none;color:var(--pri);border-radius:12px;padding:10px 4px;font-size:15px;font-weight:800}
nav.row button.sec{background:none;color:var(--mut);font-weight:600}
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:var(--sh)}
.card .hd{cursor:pointer}
.card .nm{font-weight:700}.card .sub{font-size:13px;color:var(--mut)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:1px 9px;margin-left:6px;background:var(--bg);color:var(--mut)}
.tag.hi{color:#fff;background:var(--hi)}.tag.mid{color:#9a6200;background:#fff3d6}
.detail{margin-top:10px;font-size:14px;border-top:1px solid var(--line);padding-top:8px}
.detail dt{font-size:12px;color:var(--mut);margin-top:8px}.detail dd{margin:0;white-space:pre-wrap;word-break:break-word}
.detail a{color:var(--pri)}
.detail textarea{min-height:150px;font-size:14px}
h2 .n{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;font-size:12px;margin-right:8px;vertical-align:1px}
#evChip{background:var(--chip);color:var(--pri);border-radius:20px;padding:3px 10px;font-weight:600;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#evChip:empty,#totalChip:empty{display:none}
#totalChip{background:var(--chip);color:var(--pri);border-radius:20px;padding:3px 11px;font-weight:700}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.fl::-webkit-scrollbar{display:none}
.fl button{flex:none;padding:6px 12px;font-size:13px;border-radius:20px;background:var(--bg);color:var(--mut);box-shadow:none;font-weight:600}
.fl button.on{background:var(--pri);color:#fff;box-shadow:none;font-weight:700}
nav.row button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
nav.row button svg{display:block}
.card.li{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.card.li .hd{flex:1;display:flex;align-items:center;gap:12px}
.card.li .detail{flex-basis:100%}
.av{width:42px;height:42px;border-radius:50%;background:var(--chip);color:var(--pri);font-weight:800;display:grid;place-items:center;font-size:17px;flex:none}
.av.c1{background:#fde9d9;color:#c2570c}.av.c2{background:#e0f2e9;color:#1c7a4b}.av.c3{background:#ece8fb;color:#5b45c7}
.card.li .g{flex:1;min-width:0}.card.li .meta{font-size:11px;color:var(--mut)}
.card.li .r{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.stt{font-size:11px;font-weight:700;color:#b42318;background:#fde8e6;border-radius:6px;padding:2px 8px;white-space:nowrap}
.stt.ok{color:#1c7a4b;background:#e0f2e9}.stt.pr{color:#1d4fbf;background:#e3ecfc}
button.danger{color:#b42318;background:#fde8e6}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:9;background:#14213d;color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.err{background:#b42318}
</style>
</head>
<body>
<header>
  <div class="brand"><svg width="30" height="30" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#1f4fd8"/><rect x="10" y="13" width="24" height="17" rx="3" fill="#fff"/><rect x="14" y="18" width="9" height="2.6" rx="1.3" fill="#1f4fd8"/><rect x="14" y="23" width="15" height="2.6" rx="1.3" fill="#1f4fd8" opacity=".5"/><circle cx="35" cy="33" r="8" fill="#ff7a1a"/><path d="M35 38V28.5M30.8 32.6L35 28.4l4.2 4.2" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><h1>名刺ブースト</h1></div>
  <button class="sec sm" id="btnSettings">設定</button>
</header>
<div class="chips"><span class="badge" id="evChip"></span><span class="badge" id="count"></span><span class="badge" id="totalChip"></span></div>

<section id="settings" class="hidden">
  <h2>かんたん設定</h2>
  <p class="badge" style="margin:0 0 8px">スプレッドシートのメニュー「名刺メモ → ③ スマホ用の設定コード」でコピーした、設定コードを貼り付けます。</p>
  <button id="btnPasteCode" style="width:100%">📋 設定コードを貼り付けて設定</button>
  <input id="cfgCode" placeholder="貼り付けできないときは、ここに貼る(M1.…)" autocomplete="off" style="margin-top:8px">
  <h2 style="margin-top:16px">接続設定(この端末に保存)</h2>
  <p class="badge" style="margin:0 0 8px">上の「かんたん設定」を使わない場合は、URLと合言葉を、直接入れます。</p>
  <label>GAS ウェブアプリURL</label><input id="cfgUrl" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec">
  <label>合言葉(GASのTOKEN)</label><input id="cfgToken" type="password">
  <label>展示会名(メール文面・シートに使用)</label><input id="cfgEvent" placeholder="例: 〇〇EXPO 2026">
  <h2 style="margin-top:16px">お礼メールの文体</h2>
  <div class="grid">
    <div><label>丁寧さ</label>
      <select id="cfgTone"><option value="formal">とても丁寧</option><option value="standard">標準</option><option value="friendly">親しみやすい</option></select></div>
    <div><label>長さ</label>
      <select id="cfgLength"><option value="short">短め</option><option value="standard">標準</option><option value="long">詳しめ</option></select></div>
  </div>
  <label>署名(空欄ならGAS側の既定署名)</label><textarea id="cfgSig" style="min-height:90px" placeholder="株式会社〇〇&#10;営業部 山田 太郎&#10;TEL: 03-xxxx-xxxx"></textarea>
  <label>追加指示(任意)</label><input id="cfgExtra" placeholder="例: 来月のセミナー案内も一言添える">
  <label>メール方式(お礼メールの作り方)</label>
  <select id="cfgMail">
    <option value="gmail">Gmail下書きを作成(Gmailをお使いの方)</option>
    <option value="app">メールアプリで開く(Outlook等をお使いの方)</option>
    <option value="none">メールは作成しない</option>
  </select>
  <div class="row" style="margin-top:12px">
    <button class="sec" id="btnTest">接続テスト</button>
    <button id="btnSaveCfg">保存</button>
  </div>
</section>

<nav class="row">
  <button id="tabReg"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>登録</span></button>
  <button id="tabList" class="sec"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 7h12M8 12h12M8 17h12M4 7h.01M4 12h.01M4 17h.01"/></svg><span>一覧</span></button>
</nav>

<div id="viewReg">
<section id="queueBox" class="hidden">
  <h2>保留中(<span id="qn">0</span>件)</h2>
  <div id="queueList"></div>
</section>

<section>
  <h2><i class="n">1</i>名刺を撮影(裏面は任意)</h2>
  <input id="file1" type="file" accept="image/*" capture="environment" class="hidden">
  <input id="file2" type="file" accept="image/*" capture="environment" class="hidden">
  <div class="shots">
    <div class="shot"><img id="pv1" alt="表"><button id="btnShoot1">📷 表面</button></div>
    <div class="shot"><img id="pv2" alt="裏"><button class="sec" id="btnShoot2">📷 裏面</button></div>
  </div>
</section>

<section>
  <h2><i class="n">2</i>話した内容</h2>
  <textarea id="memo" placeholder="例: 工場の検査工程の自動化に関心。来月デモ希望。担当は部長の佐藤さん。"></textarea>
  <div style="margin-top:8px">
    <button class="sec mic" id="btnMic">🎤 録音して話す</button>
    <div class="miclive hidden" id="micLive"><span class="dot"></span><b id="micTime">0:00</b><span id="micHint">話してください。終わったら「停止」</span></div>
    <div id="micInterim" aria-live="polite"></div>
    <p class="badge" id="micNote" style="margin:4px 0 0">商談のあと、30秒ほど話すだけでOK。話した内容は、上の欄に文字で入ります(直せます)。</p>
  </div>
</section>

<div class="row">
  <button class="sec" id="btnHold" style="padding:14px">保留して次へ</button>
  <button id="btnAnalyze" style="padding:14px">AIで解析する</button>
</div>
<p id="status"></p>

<section id="mailDone" class="hidden" style="border-color:var(--pri)">
  <h2>✉️ お礼メールを作成</h2>
  <div class="sub" id="mailTo" style="font-size:14px;margin-bottom:8px"></div>
  <div class="row">
    <a class="btn" id="btnMailto" href="#" style="display:block;text-align:center;text-decoration:none;background:var(--pri);color:#fff;border-radius:12px;padding:12px 16px;font-weight:600">メールアプリで開く</a>
    <button class="sec" id="btnMailCopy">文面をコピー</button>
  </div>
  <p class="badge" id="mailNote" style="margin:8px 0 0"></p>
  <div style="margin-top:8px"><button class="sec sm" id="btnMailClose" style="width:100%">閉じる(次の名刺へ)</button></div>
</section>

<section id="dup" class="warn hidden">
  <h2>⚠ 登録済みの可能性があります</h2>
  <div id="dupList"></div>
  <div class="row" style="margin-top:10px">
    <button id="btnMerge">既存の行に追記</button>
    <button class="sec" id="btnNew">別人として新規登録</button>
  </div>
  <div style="margin-top:8px"><button class="sec" id="btnDupCancel" style="width:100%">戻って修正</button></div>
</section>

<section id="result" class="hidden">
  <h2><i class="n">3</i>確認・修正</h2>
  <div class="grid">
    <div><label>氏名</label><input id="f_name"></div>
    <div><label>ふりがな</label><input id="f_kana"></div>
    <div><label>会社名</label><input id="f_company"></div>
    <div><label>部署・役職</label><input id="f_title"></div>
    <div><label>メール</label><input id="f_email" type="email"></div>
    <div><label>電話</label><input id="f_phone" type="tel"></div>
  </div>
  <label>住所</label><input id="f_address">
  <label>URL</label><input id="f_url">
  <label>温度感</label>
  <select id="f_temp"><option>高</option><option>中</option><option>低</option></select>
  <label>商談要約</label><textarea id="f_summary"></textarea>
  <label>次のアクション</label><input id="f_next">
  <label>メール件名</label><input id="f_subject">
  <label>メール本文(下書き)</label><textarea id="f_body" style="min-height:260px"></textarea>
  <div id="docBox" class="hidden"><label>添付する資料(シート「資料」に登録したもの)</label><div id="docList"></div><p class="badge" id="docNote" style="margin:6px 0 0"></p></div>
  <div class="row" style="margin-top:12px"><button id="btnSave">スプレッドシート登録 + Gmail下書き</button></div>
</section>

</div>

<div id="viewList" class="hidden">
  <section>
    <div class="row">
      <input id="q" type="search" placeholder="検索(氏名・会社・内容・展示会)" style="flex:3">
      <button class="sec" id="btnReload" style="flex:1">更新</button>
    </div>
    <div class="fl" id="stChips"></div>
    <div class="row" style="margin-top:8px;align-items:center;flex-wrap:nowrap">
      <label for="sortSel" style="margin:0;flex:none;font-size:13px">並び順</label>
      <select id="sortSel" style="flex:1;padding:8px 10px">
        <option value="new">日時(新しい順)</option>
        <option value="old">日時(古い順)</option>
        <option value="temp">見込み度(高→低)</option>
        <option value="name">氏名(あいうえお順)</option>
        <option value="co">会社名(あいうえお順)</option>
      </select>
    </div>
    <p class="badge" id="listInfo" style="margin:8px 0 0"></p>
  </section>
  <div id="listBox"></div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="app.js?v=9"></script>
</body>
</html>
